name: Real-Time On-Chain Balance Auditor

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  audit-balances:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Query On-Chain Balances
        run: |
          python3 -c "
          import urllib.request, json, datetime

          results = {
              'timestamp_utc': datetime.datetime.utcnow().isoformat() + 'Z'
          }

          # 1. Base / EVM (with multi-RPC fallback)
          base_rpcs = [
              'https://base-rpc.publicnode.com',
              'https://1rpc.io/base',
              'https://mainnet.base.org'
          ]
          base_bal = None
          for rpc in base_rpcs:
              try:
                  req = urllib.request.Request(
                      rpc,
                      data=json.dumps({'jsonrpc': '2.0', 'id': 1, 'method': 'eth_getBalance', 'params': ['0xef5766253e2d92e530e301ac22dcb8de78e89c55', 'latest']}).encode(),
                      headers={'Content-Type': 'application/json', 'User-Agent': 'Mozilla/5.0'}
                  )
                  with urllib.request.urlopen(req, timeout=8) as r:
                      res = json.loads(r.read().decode())
                      val = int(res.get('result', '0x0'), 16) / 1e18
                      base_bal = val
                      results['base_eth'] = val
                      results['base_rpc_used'] = rpc
                      print(f'✅ Base ETH ({rpc}): {val}')
                      break
              except Exception as e:
                  print(f'Failed {rpc}: {e}')
          if base_bal is None:
              results['base_eth'] = 0.0

          # 2. Solana
          try:
              req = urllib.request.Request(
                  'https://api.mainnet-beta.solana.com',
                  data=json.dumps({'jsonrpc': '2.0', 'id': 1, 'method': 'getBalance', 'params': ['3HLDkipdKmJKGjbgCD8moo3GyhEY4DWdZ7JAgSpMysHp']}).encode(),
                  headers={'Content-Type': 'application/json'}
              )
              with urllib.request.urlopen(req, timeout=10) as r:
                  val = json.loads(r.read().decode()).get('result', {}).get('value', 0) / 1e9
                  results['solana_sol'] = val
                  print(f'✅ Solana SOL: {val}')
          except Exception as e:
              results['solana_sol'] = f'error: {e}'
              print(f'❌ Solana SOL: {e}')

          # 3. Bitcoin
          try:
              req = urllib.request.Request('https://blockstream.info/api/address/bc1pavl0c4wn596jmexty56ret76gnj9jxf7px7w983vmt6akymjgahsjk803e', headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=10) as r:
                  d = json.loads(r.read().decode())
                  val = (d.get('chain_stats', {}).get('funded_txo_sum', 0) - d.get('chain_stats', {}).get('spent_txo_sum', 0)) / 1e8
                  results['bitcoin_btc'] = val
                  print(f'✅ Bitcoin BTC: {val}')
          except Exception as e:
              results['bitcoin_btc'] = f'error: {e}'
              print(f'❌ Bitcoin BTC: {e}')

          # 4. Stellar
          try:
              req = urllib.request.Request('https://horizon.stellar.org/accounts/GBS2F7RTMYO53E33JGTO32HR3IQ75RI7RDMQX5C3KROZQIJ5IXOMI2WA', headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=10) as r:
                  d = json.loads(r.read().decode())
                  results['stellar_balances'] = d.get('balances', [])
                  print(f'✅ Stellar Balances: {d.get("balances", [])}')
          except Exception as e:
              results['stellar_balances'] = 'unfunded (0 XLM - needs 1 XLM reserve activation)'
              print(f'ℹ️ Stellar Account: {e}')

          with open('balances.json', 'w') as f:
              json.dump(results, f, indent=2)
          "

      - name: Commit Updated Balances
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add balances.json
          git commit -m "chore: update live on-chain balances [skip ci]"
          git push origin main
